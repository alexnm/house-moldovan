<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Map pin. The sides are the tangents from the tip to the head circle, so the
       shoulder flows into the point instead of kinking. The hole is punched out
       rather than drawn, which is what keeps it a pin and not a teardrop once the
       tab shrinks it to 16px.

       #d9875c is the sRGB twin of the terracotta token (ACCENT_HEX in
       packages/shared) — tab chrome and resvg do not read CSS Color 4. Terracotta
       carries both light and dark tab chrome, so unlike an ink mark this needs no
       prefers-color-scheme switch. -->
  <mask id="pin-hole">
    <rect width="32" height="32" fill="white" />
    <circle cx="16" cy="12" r="3.8" fill="black" />
  </mask>
  <path
    d="M16 30 L7.69 17.56 A10 10 0 1 1 24.31 17.56 Z"
    fill="#d9875c"
    mask="url(#pin-hole)"
  />
</svg>
